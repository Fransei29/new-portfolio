<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Portadas del feed</title>
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-600.woff2") format("woff2"); font-weight: 600; }
      :root { --dark: #2e294e; --ink: #292833; --lilac: #b59cf8; --lilac-2: #8e7ae6; --lilac-3: #7d68d8; --paper: #f3f2f4; --mist: #e9e7ee; --muted: #8a8599; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #111; display: flex; flex-direction: column; gap: 40px; padding: 40px; align-items: center; font-family: "Plus Jakarta Sans", sans-serif; }

      .slide { position: relative; width: 1080px; height: 1440px; overflow: hidden; background: var(--paper); color: var(--ink); }
      .slide.dark { background: var(--dark); color: #fff; }
      .hud { position: absolute; top: 64px; left: 80px; right: 80px; display: flex; justify-content: space-between; font: 600 26px "Plus Jakarta Sans"; letter-spacing: 0.18em; color: var(--muted); z-index: 6; }
      .dark .hud { color: rgba(255,255,255,0.75); }
      .copy { position: absolute; left: 80px; right: 80px; top: 170px; z-index: 5; }
      .kicker { font: 600 30px "Plus Jakarta Sans"; letter-spacing: 0.16em; color: var(--lilac-3); margin-bottom: 24px; }
      .dark .kicker { color: var(--lilac); }
      h1 { font: 500 120px/1 "Bricolage Grotesque"; letter-spacing: -0.03em; }
      h1 em { font-style: normal; color: var(--lilac-2); }
      .dark h1 em { color: var(--lilac); }
      .sub { font: 500 40px/1.3 "Plus Jakarta Sans"; margin-top: 22px; color: #5c5866; }
      .dark .sub { color: rgba(255,255,255,0.78); }

      /* Notebook */
      .laptop { position: absolute; z-index: 3; }
      .laptop .screen { background: #0e0d14; border-radius: 26px 26px 0 0; padding: 22px 22px 26px; box-shadow: 0 50px 110px rgba(10,8,25,0.45); }
      .laptop .screen img { display: block; width: 100%; border-radius: 6px; }
      .laptop .base { height: 30px; margin: 0 -70px; background: linear-gradient(#d9d7e0, #a9a6b4); border-radius: 0 0 26px 26px; position: relative; }
      .laptop .base::after { content: ""; position: absolute; left: 50%; top: 0; width: 180px; height: 12px; margin-left: -90px; background: #bdbac7; border-radius: 0 0 12px 12px; }
      .dark .laptop .base { background: linear-gradient(#cfcdd8, #8f8c9c); }

      .phone { position: absolute; border-radius: 56px; background: #0e0d14; padding: 14px; box-shadow: 0 40px 90px rgba(0,0,0,0.45); z-index: 4; }
      .phone img { display: block; width: 100%; border-radius: 44px; }

      .glow { position: absolute; border-radius: 50%; z-index: 1; }
      .tag { display: inline-block; font: 600 28px "Plus Jakarta Sans"; padding: 12px 24px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(181,156,248,0.4); margin: 0 10px 10px 0; }
    </style>
  </head>
  <body>

    <!-- A · Portada de caso: el proyecto en la compu + el celu -->
    <section class="slide dark" id="caso">
      <div class="hud"><span>FRANCO SEILER</span><span>CASO 01</span></div>
      <div class="glow" style="width:1100px;height:1100px;left:-10px;top:420px;background:radial-gradient(circle,rgba(181,156,248,0.32),transparent 62%)"></div>
      <div class="copy">
        <div class="kicker">CASO DE ESTUDIO</div>
        <h1>Bellum</h1>
        <p class="sub">Sitio y panel para una firma financiera de EE.UU.</p>
      </div>
      <div class="laptop" style="left:140px;top:660px;width:800px">
        <div class="screen"><img src="media/hero.webp" alt="" /></div>
        <div class="base"></div>
      </div>
      <div class="phone" style="left:730px;top:820px;width:260px"><img src="media/m-hero.png" alt="" /></div>
    </section>

    <!-- B · Portada con la cara: quién soy -->
    <section class="slide dark" id="yo">
      <div class="hud"><span>FRANCO SEILER</span><span>SOFTWARE STUDIO</span></div>
      <div class="laptop" style="left:-260px;top:300px;width:820px;transform:rotate(-8deg);opacity:0.9">
        <div class="screen"><img src="media/eltriunfo.webp" alt="" /></div>
        <div class="base"></div>
      </div>
      <div class="laptop" style="left:560px;top:250px;width:820px;transform:rotate(7deg);opacity:0.9">
        <div class="screen"><img src="media/cdq.webp" alt="" /></div>
        <div class="base"></div>
      </div>
      <div class="glow" style="width:1000px;height:1000px;left:40px;top:420px;background:radial-gradient(circle,rgba(181,156,248,0.45),transparent 62%)"></div>
      <img src="media/foto-recortada-transparente.png" alt="" style="position:absolute;left:90px;top:440px;width:900px;z-index:4" />
      <div style="position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(transparent,var(--dark) 55%);z-index:5"></div>
      <div class="copy" style="top:auto;bottom:110px">
        <h1 style="font-size:112px">Hola, soy <em>Franco.</em></h1>
        <p class="sub">Hago el software de negocios reales.</p>
      </div>
    </section>

    <!-- C · Misma plantilla de caso, en claro, para alternar en la grilla -->
    <section class="slide" id="caso2">
      <div class="hud"><span>FRANCO SEILER</span><span>CASO 02</span></div>
      <div class="glow" style="width:1100px;height:1100px;left:-10px;top:420px;background:radial-gradient(circle,rgba(142,122,230,0.22),transparent 62%)"></div>
      <div class="copy">
        <div class="kicker">CASO DE ESTUDIO</div>
        <h1>El Triunfo</h1>
        <p class="sub">La web de una empresa agro con 30 años de historia.</p>
      </div>
      <div class="laptop" style="left:140px;top:660px;width:800px">
        <div class="screen"><img src="media/eltriunfo.webp" alt="" /></div>
        <div class="base"></div>
      </div>
    </section>

  </body>
</html>
