<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demo · Panel El Triunfo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --forest: #012615; --forest-2: #06331f; --green: #017942; --green-l: #e8f3ec; --lime: #9DBF2E; --lime-l: #f1f6df;
  --ink: #111827; --body: #374151; --muted: #6b7280; --line: #e5e7eb; --bg: #f9fafb; --white: #fff;
  --title: 'Barlow Condensed', 'Arial Narrow', sans-serif; --sans: 'Geist', 'Inter', system-ui, -apple-system, sans-serif; --brand-sans: 'Barlow', system-ui, sans-serif;
  --r: 10px; --shadow: 0 1px 2px rgba(0,0,0,.04); --shadow-h: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04); --line-h: #d1d5db; --g100: #f3f4f6; --g400: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); color: var(--body); background: var(--bg); font-size: 15px; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ── Login ── */
.login { position: fixed; inset: 0; display: grid; grid-template-columns: 1.1fr 1fr; background: radial-gradient(120% 90% at 100% 0%, #eef5e6 0%, rgba(238,245,230,0) 55%), radial-gradient(90% 80% at 0% 100%, #e6f1ea 0%, rgba(230,241,234,0) 60%), #f3f6f4; }
.login .art { position: relative; background: var(--forest) center/cover; }
.login .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(1,38,21,.55), rgba(1,38,21,.92)); }
.login .art div { position: absolute; left: 48px; bottom: 48px; right: 48px; z-index: 1; color: #fff; }
.login .art h1 { font-family: var(--title); text-transform: uppercase; font-size: 54px; line-height: .92; }
.login .art h1 span { color: var(--lime); display: block; }
.login .art p { color: rgba(255,255,255,.8); margin-top: 14px; font-size: 16px; max-width: 420px; line-height: 1.5; }
.login form { align-self: center; justify-self: center; width: min(420px, 88%); display: flex; flex-direction: column; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 34px 34px 30px; box-shadow: 0 2px 6px rgba(1,38,21,.05), 0 24px 60px rgba(1,38,21,.10); }
.login form img { height: 84px; align-self: flex-start; margin-bottom: 18px; }
.login h2 { font-size: 28px; color: var(--ink); font-weight: 500; letter-spacing: -.01em; }
.login .hint { font-size: 13px; color: var(--muted); }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input, .textarea, select.input { width: 100%; border: 1px solid #d1d5db; border-radius: 9px; padding: 10px 12px; background: #fff; outline: none; transition: border .15s, box-shadow .15s; }
.input:focus, .textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(1,121,66,.12); }
.textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 14.5px; border: 1px solid var(--line); background: #fff; color: var(--ink); transition: .15s; white-space: nowrap; }
.btn:hover { border-color: #d1d5db; background: #fbfcfb; }
.btn.pri { background: var(--green); border-color: var(--green); color: #fff; }
.btn.pri:hover { background: #015c31; }
.btn.lime { background: var(--lime); border-color: var(--lime); color: var(--forest); }
.btn.lime:hover { background: #b0d13d; }
.btn.big { padding: 12px 18px; font-size: 15px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn svg { width: 16px; height: 16px; }

/* ── App ── */
.app { --sw: 248px; position: fixed; inset: 0; display: grid; grid-template-columns: var(--sw) minmax(0, 1fr); transition: grid-template-columns .22s cubic-bezier(.2,.7,.2,1); }
.app.mini { --sw: 68px; }
.side { background: #fff; border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; overflow-x: hidden; }
.side .brand { display: flex; align-items: center; height: 60px; margin: 2px 6px 18px; }
.side .brand img { height: 52px; }
.side .brand .mono { display: none; width: 38px; height: 38px; border-radius: 10px; background: var(--forest); color: var(--lime); font-family: var(--title); font-size: 17px; letter-spacing: .04em; place-items: center; }
.side .grp { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #9ca3af; margin: 16px 12px 6px; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px; color: #4b5563; font-weight: 500; text-align: left; width: 100%; position: relative; white-space: nowrap; }
.nav:hover { background: #f3f4f6; color: var(--ink); }
.nav.on { background: var(--g100); color: var(--ink); font-weight: 600; }
.nav.on svg { color: var(--green); }
.nav .badge { margin-left: auto; background: var(--green); color: #fff; font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 7px; min-width: 20px; text-align: center; }
.side .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.side .note { font-size: 12px; color: var(--muted); padding: 6px 12px 10px; line-height: 1.45; }
.app.mini .side { padding-inline: 10px; }
.app.mini .side .brand { justify-content: center; margin-inline: 0; }
.app.mini .side .brand img, .app.mini .nav .lb, .app.mini .side .note { display: none; }
.app.mini .side .brand .mono { display: grid; }
.app.mini .side .grp { font-size: 0; height: 1px; background: var(--line); margin: 12px 8px; }
.app.mini .nav { justify-content: center; padding: 10px 0; }
.app.mini .nav .badge { position: absolute; top: 3px; right: 5px; padding: 0 5px; font-size: 10px; }
.app.mini .collapse svg { transform: rotate(180deg); }
.tip { position: fixed; z-index: 95; background: var(--forest); color: #fff; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 7px; pointer-events: none; white-space: nowrap; transform: translateY(-50%); box-shadow: 0 8px 20px rgba(1,38,21,.25); }
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.top { height: 62px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 22px 0 14px; flex-shrink: 0; }
.top .crumb { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top .crumb small { font-size: 11.5px; color: var(--muted); }
.top h1 { font-size: 17px; color: var(--ink); font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: #4b5563; flex-shrink: 0; }
.icon-btn:hover { background: #f3f4f6; color: var(--ink); }
.find { display: flex; align-items: center; gap: 8px; width: min(320px, 30vw); padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: #f9fafb; font-size: 13px; }
.find:hover { border-color: #d1d5db; }
.find span { flex: 1; text-align: left; }
kbd { font-family: var(--sans); font-size: 11px; font-weight: 600; color: #6b7280; border: 1px solid #e5e7eb; border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: #fff; }
.top .who { width: 34px; height: 34px; border-radius: 50%; background: var(--forest); color: var(--lime); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.menu { position: fixed; z-index: 70; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 40px rgba(1,38,21,.16); padding: 6px; min-width: 220px; animation: pop .15s; }
.menu .mh { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu .mh b { display: block; color: var(--ink); }
.menu .mh small { color: var(--muted); font-size: 12px; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; }
.menu button:hover { background: #f3f4f6; }
.view { flex: 1; overflow-y: auto; padding: 24px 28px; }
.wrap { display: flex; flex-direction: column; gap: 20px; max-width: 1400px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-h p { color: var(--body); max-width: 680px; line-height: 1.55; font-size: 15px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #9ca3af; width: 16px; height: 16px; }
.search .input { padding-left: 34px; }
.seg { display: inline-flex; background: #f3f4f6; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(1,38,21,.1); }
.seg button em { font-style: normal; color: #9ca3af; margin-left: 4px; font-weight: 500; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.card h3 { font-size: 15px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -20px -20px 12px; padding: 14px 20px; min-height: 54px; border-bottom: 1px solid var(--line); background: var(--bg); border-radius: 10px 10px 0 0; }
.card h3 small { font-weight: 500; color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.g2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.g3c { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); }
.todo { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid #f3f4f6; width: 100%; text-align: left; }
.todo:last-child { border-bottom: 0; }
.todo .n { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex-shrink: 0; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
.todo .t { flex: 1; min-width: 0; }
.todo .t b { display: block; color: var(--ink); font-size: 14px; font-weight: 500; }
.todo .t span { font-size: 13.5px; color: var(--muted); }
.todo > svg { color: #d1d5db; }
.todo:hover > svg { color: var(--green); }
/* Blog / Recursos */
.kwtable td:first-child b { color: var(--ink); }
.vol { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.vol i { display: block; height: 6px; border-radius: 99px; background: var(--green); opacity: .75; }
.pill svg { width: 13px; height: 13px; vertical-align: -2px; }
.pill { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 99px; background: #fff; border: 1px solid var(--line); color: var(--body); white-space: nowrap; }
.writer { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.article { line-height: 1.7; color: #2f3d33; font-size: 14.5px; display: flex; flex-direction: column; gap: 10px; }
.article h2 { font-family: var(--title); text-transform: uppercase; color: var(--ink); font-size: 30px; line-height: 1; }
.article h3 { font-size: 16.5px; color: var(--ink); margin-top: 8px; }
.article mark { background: #eef6d6; color: inherit; border-radius: 3px; padding: 0 2px; }
.article a { color: var(--green); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.score { display: flex; align-items: center; gap: 14px; }
.ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--green) calc(var(--p) * 1%), #e5e7eb 0); flex-shrink: 0; }
.ring b { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--ink); font-size: 16px; }
.chk { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; padding: 7px 0; border-bottom: 1px solid #f3f4f6; }
.chk:last-child { border-bottom: 0; }
.chk i { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; margin-top: 1px; background: #e5e7eb; color: #9ca3af; }
.chk.ok i { background: var(--green); color: #fff; }
.side-sticky { position: sticky; top: 0; display: flex; flex-direction: column; gap: 14px; }
/* Modal y buscador rápido */
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: start center; padding-top: 12vh; background: rgba(1,20,10,.35); }
.modal .box { width: min(560px, 92vw); background: #fff; border-radius: 14px; box-shadow: 0 30px 70px rgba(0,0,0,.28); overflow: hidden; animation: pop .18s; }
.modal .box.sm { padding: 22px; display: flex; flex-direction: column; gap: 10px; margin-top: 8vh; }
.modal .box.sm b { color: var(--ink); font-size: 16px; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pal-in input { flex: 1; border: 0; outline: none; font-size: 15px; }
.pal-list { max-height: 50vh; overflow-y: auto; padding: 6px; }
.pal-list .grp { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9ca3af; padding: 10px 10px 4px; }
.pal-list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; text-align: left; }
.pal-list button span { flex: 1; color: var(--ink); }
.pal-list button small { color: var(--muted); font-size: 12px; }
.pal-list button.on { background: var(--green-l); }
.pal-list button.on svg { color: var(--green); }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi strong { order: 2; } .kpi small { order: 3; } .kpi em { order: 4; } .kpi .ic { order: 1; }
button.kpi { text-align: left; width: 100%; position: relative; cursor: pointer; }
.kpi .go { position: absolute; top: 20px; right: 20px; color: #d1d5db; transition: color .15s ease, transform .15s ease; }
.kpi .go svg { width: 18px; height: 18px; }
button.kpi:hover .go { color: var(--ink); transform: translate(2px, -2px); }
.kpi .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); color: var(--green); margin-bottom: 10px; }
.kpi .ic svg { width: 17px; height: 17px; }
.kpi small { color: var(--muted); font-size: 14px; margin-top: 4px; }
.kpi strong { font-size: 24px; color: var(--body); font-weight: 500; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi em { font-style: normal; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 2px 0 4px; }
.hello h2 { font-size: 24px; color: var(--ink); font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }
.hello h2 span { color: var(--green); }
.hello p { color: var(--muted); margin-top: 6px; max-width: 680px; line-height: 1.55; font-size: 15px; }
.hello > div:first-child { flex: 1 1 360px; min-width: 0; }
.hello .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 250px; overflow: visible; }
.chart .gl { stroke: var(--g100); stroke-width: 1; }
.chart .yl, .chart .xl { fill: var(--g400); font-size: 11.5px; font-family: var(--sans); }
.chart .ln { fill: none; stroke: var(--green); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.chart .ar { fill: url(#chartFill); }
.chart .xh { stroke: var(--line-h); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.chart .pt { fill: var(--green); stroke: #fff; stroke-width: 2; }
.chart .tip2 { position: absolute; transform: translate(-50%, -100%); margin-top: -12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; box-shadow: var(--shadow-h); font-size: 12.5px; white-space: nowrap; pointer-events: none; }
.chart .tip2 b { display: block; color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.chart .tip2 span { color: var(--muted); }
.li { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
.li:last-child { border-bottom: 0; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; color: var(--ink); font-size: 14px; font-weight: 500; }
.li .t span { color: var(--muted); font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px 2px 8px; border-radius: 99px; white-space: nowrap; background: #fff; border: 1px solid var(--line); color: var(--body); --dot: var(--g400); }
.st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--dot); flex-shrink: 0; }
.st.Nuevo { --dot: #16a34a; }
.st.Contactado { --dot: #2563eb; }
.st.Calificado { --dot: #7c3aed; }
.st.Cliente, .st.Ganado { --dot: #017942; }
.st.Descartado, .st.Perdido { --dot: var(--g400); }
.tabs button em { font-style: normal; font-size: 11.5px; font-weight: 700; background: #f3f4f6; color: var(--muted); border-radius: 99px; padding: 2px 8px; margin-left: 8px; }
.tabs button.on em { background: var(--green-l); color: var(--green); }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 5px 10px; border-radius: 99px; background: #f3f4f6; color: var(--muted); }
.chip b { color: var(--ink); font-weight: 600; }
.notice { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); border-left: 3px solid #d97706; background: #fff; color: var(--body); font-size: 14px; flex-wrap: wrap; }
.notice > svg { color: #d97706; }
.m small.rate { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 11.5px; color: var(--muted); }
.m small.rate svg, .rate-btns svg, .rt svg { width: 14px; height: 14px; }
.rt { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.rt svg + * { margin-right: 6px; }
.m.u small.rate { color: rgba(255,255,255,.75); }
.m .time { display: block; font-size: 10.5px; opacity: .6; margin-top: 3px; }
.rate-btns { display: flex; gap: 4px; margin-top: 6px; }
.rate-btns button { display: grid; place-items: center; color: var(--muted); padding: 4px 7px; border-radius: 99px; border: 1px solid var(--line); background: #fff; }
.rate-btns button:hover { border-color: var(--green); }
.kb-types { display: grid; gap: 10px; }
.kb-types button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
.kb-types button:hover { border-color: var(--green); background: #f9fafb; }
.kb-types b { display: block; color: var(--ink); }
.kb-types small { color: var(--muted); font-size: 12.5px; }
.cfg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cfg .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
.cfg .row b { color: var(--ink); display: block; font-size: 14px; }
.cfg .row small { color: var(--muted); font-size: 12.5px; }
.hint2 { font-size: 12px; color: var(--muted); margin-top: 4px; }
@media (max-width: 1100px) { .cfg { grid-template-columns: 1fr; } }
.st.warn { --dot: #d97706; }
.empty { text-align: center; padding: 26px; color: var(--muted); font-size: 13.5px; }

/* Editor */
.tabs { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.tabs button { padding: 14px 16px; white-space: nowrap; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--green); border-color: var(--green); }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 42%); gap: 18px; align-items: start; }

.form { display: flex; flex-direction: column; gap: 14px; }

.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.prev { position: sticky; top: 0; }

.mini-hero { aspect-ratio: 4/3; background: center/cover; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 18px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(1,20,10,.35); z-index: 60; opacity: 0; pointer-events: none; transition: .25s; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: #fff; z-index: 61; transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.7,.2,1); display: flex; flex-direction: column; }

/* Tablas */

.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.pipeline > * { border-radius: 12px; padding: 12px 14px; background: #fff; border: 1px solid var(--line); text-align: left; transition: .15s; }

/* Novedades */
.post { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }

.post .t span { font-size: 12.5px; color: var(--muted); }

.cover-gen { aspect-ratio: 21/7; max-height: 220px; border-radius: 12px; background: #f3f4f6 center/cover; display: grid; place-items: center; color: var(--muted); font-size: 13px; position: relative; overflow: hidden; }
.cover-gen.loading::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: shimmer 1.2s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.serp { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }

/* Toggle */

.review { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid #f3f4f6; align-items: flex-start; }

/* Toast */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: var(--forest); color: #fff; padding: 12px 18px; border-radius: 12px; display: flex; gap: 10px; align-items: center; z-index: 90; opacity: 0; pointer-events: none; transition: .3s; box-shadow: 0 16px 40px rgba(1,38,21,.35); font-weight: 500; max-width: 92vw; }

/* ── Vista web ── */
.site, .login .art, .chat, .invite { font-family: var(--brand-sans); }
.site { position: fixed; inset: 0; overflow-y: auto; background: #fff; z-index: 40; }

.shero { margin-top: -72px; height: 86vh; min-height: 520px; background: center/cover; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; }

.scard div:last-child { padding: 14px 16px; }
.scard b { font-family: var(--title); text-transform: uppercase; font-size: 22px; color: var(--ink); }
.scard p { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.sfoot { background: var(--forest); color: rgba(255,255,255,.7); padding: 40px 32px; text-align: center; font-size: 13px; }

/* Chat widget */
.fab { position: fixed; right: 22px; bottom: 22px; z-index: 46; width: 60px; height: 60px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; box-shadow: 0 14px 30px rgba(1,121,66,.45); }
.fab svg { width: 26px; height: 26px; }
.fab .ping { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--green); animation: ping 1.8s infinite; }
@keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(1.6); opacity: 0; } }
.invite { position: fixed; right: 92px; bottom: 32px; z-index: 46; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 14px 34px rgba(0,0,0,.18); font-size: 13.5px; max-width: 250px; color: var(--ink); }
.chat { position: fixed; right: 22px; bottom: 92px; z-index: 47; width: min(380px, calc(100vw - 24px)); height: min(580px, calc(100vh - 160px)); background: #fff; border-radius: 20px; box-shadow: 0 30px 70px rgba(0,0,0,.28); display: flex; flex-direction: column; overflow: hidden; transform-origin: bottom right; animation: pop .25s cubic-bezier(.2,.7,.2,1); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.chat .ch { background: var(--forest); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.chat .ch .bot { width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: var(--forest); display: grid; place-items: center; }

.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 9px; background: var(--bg); }
.m { max-width: 84%; padding: 9px 12px; border-radius: 14px; line-height: 1.45; font-size: 13.5px; animation: pop .2s; }

.m.sys { align-self: stretch; max-width: none; background: var(--bg); border: 1px solid var(--line); color: var(--body); font-size: 12.5px; display: flex; gap: 7px; align-items: center; }
.dots { display: inline-flex; gap: 3px; }

.input, .textarea { transition: border-color .15s ease, box-shadow .15s ease; }

td { transition: background-color .15s ease; }

.todo:hover > svg { color: var(--green); }
.tabs button { transition: color .15s ease, border-color .15s ease; }
.tabs button:hover { color: var(--ink); }
.seg button { transition: background-color .15s ease, color .15s ease; }

.chips button, .sugg button, .pill, .chip { transition: border-color .15s ease, background-color .15s ease; }

.top { position: relative; z-index: 2; }

// Buscador rápido (Ctrl K): secciones, contactos, conversaciones, servicios y palabras clave
function openPalette() {
  if (document.querySelector('.modal')) return;
  if ($('#app').hidden) login();
  const items = [
    ...NAV.filter(([k]) => k !== 'grp').map(([k, i, t]) => ({ g: 'Secciones', i, t, s: GROUPS[k], run: () => go(k) })),
    ...S.leads.map((l, n) => ({ g: 'Contactos', i: 'users', t: l.name, s: l.interest, run: () => { go('asistente', { tab: 'contactos' }); openLead(n); } })),
    ...S.convos.map((c) => ({ g: 'Conversaciones', i: 'msg', t: c.first, s: c.when, run: () => { go('asistente', { tab: 'conversaciones' }); openConvo(c.id); } })),
    ...S.knowledge.map((k) => ({ g: 'Base de conocimiento', i: 'book', t: k.title, s: k.type, run: () => go('conocimiento') })),
    ...S.services.map((x, n) => ({ g: 'Servicios', i: 'layers', t: x.name, s: 'Editar servicio', run: () => { go('servicios'); editService(n); } })),
    ...S.keywords.map((x) => ({ g: 'Palabras clave', i: 'target', t: x.kw, s: x.status, run: () => go('blog') })),
    { g: 'Acciones', i: 'eye', t: 'Ver la web', s: '', run: () => openSite(false) },
    { g: 'Acciones', i: 'msg', t: 'Probar el asistente', s: '', run: () => openSite(true) },
  ];
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><div class="pal-in">${ic('search')}<input id="palIn" placeholder="Buscar secciones, contactos, conversaciones…" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-list" id="palList"></div></div>`;
  document.body.appendChild(m);
  let list = [], sel = 0;
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const draw = () => {
    const q = norm($('#palIn').value.trim());
    list = items.filter((x) => !q || norm(x.t + ' ' + x.s).includes(q)).slice(0, 14); sel = Math.min(sel, Math.max(list.length - 1, 0));
    let g = '';
    $('#palList').innerHTML = list.map((x, n) => (x.g !== g ? `<div class="grp">${(g = x.g)}</div>` : '') + `<button class="${n === sel ? 'on' : ''}" data-n="${n}">${ic(x.i)}<span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join('') || '<div class="empty">Sin resultados</div>';
    $('#palList').querySelectorAll('button').forEach((b) => b.onclick = () => run(+b.dataset.n));
  };
  const close = () => m.remove();
  const run = (n) => { const x = list[n]; close(); x && x.run(); };
  $('#palIn').oninput = () => { sel = 0; draw(); };
  $('#palIn').onkeydown = (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, list.length - 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    if (e.key === 'Enter') run(sel);
    if (e.key === 'Escape') close();
  };
  m.onclick = (e) => { if (e.target === m) close(); };
  draw(); $('#palIn').focus();
}
$('#findBtn').onclick = openPalette;
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { closeDrawer(); closeMenu(); $('#app').classList.remove('open'); }
  if (e.key === '[' && !e.target.closest('input, textarea, select, [contenteditable]') && !$('#app').hidden) toggleSide();
});

const CHART = [['18 ago', 16], ['25 ago', 22], ['1 sep', 19], ['8 sep', 26], ['15 sep', 24], ['22 sep', 31], ['29 sep', 29], ['6 oct', 39]];
function drawChart(el, data) {
  const W = Math.max(320, el.clientWidth), H = 250, L = 34, R = 10, T = 12, B = 26, max = Math.ceil(Math.max(...data.map((d) => d[1])) / 10) * 10;
  const x = (i) => L + (i * (W - L - R)) / (data.length - 1), y = (v) => T + (1 - v / max) * (H - T - B);
  const ticks = [0, max / 2, max];
  const line = data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d[1])}`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Consultas por semana: ${data.map((d) => `${d[0]} ${d[1]}`).join(', ')}">
    <defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#017942" stop-opacity=".16"/><stop offset="1" stop-color="#017942" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map((t) => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="yl" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    <path class="ar" d="${line}L${x(data.length - 1)},${y(0)}L${x(0)},${y(0)}Z"/><path class="ln" d="${line}"/>
    ${data.map((d, i) => i % 2 === 0 || i === data.length - 1 ? `<text class="xl" x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle'}">${d[0]}</text>` : '').join('')}
    <line class="xh" id="cxh" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="pt" id="cpt" r="5" visibility="hidden"/>
    <circle class="pt" cx="${x(data.length - 1)}" cy="${y(data[data.length - 1][1])}" r="4.5"/>
  </svg><div class="tip2" id="ctip" hidden></div>`;
  const svg = el.querySelector('svg'), tipEl = el.querySelector('#ctip');
  const show = (i) => {
    const d = data[i], cx = x(i), cy = y(d[1]);
    const h = el.querySelector('#cxh'); h.setAttribute('x1', cx); h.setAttribute('x2', cx); h.setAttribute('visibility', 'visible');
    const p = el.querySelector('#cpt'); p.setAttribute('cx', cx); p.setAttribute('cy', cy); p.setAttribute('visibility', 'visible');
    tipEl.style.left = Math.min(Math.max(cx, 90), W - 90) + 'px'; tipEl.style.top = cy + 'px';
    const prev = i ? d[1] - data[i - 1][1] : 0;
    tipEl.innerHTML = `<b>${d[1]} consultas</b><span>Semana del ${d[0]}${i ? ` · ${prev >= 0 ? '+' : ''}${prev} vs. la anterior` : ''}</span>`; tipEl.hidden = false;
  };
  svg.onmousemove = (e) => { const px = e.clientX - svg.getBoundingClientRect().left; show(Math.max(0, Math.min(data.length - 1, Math.round(((px - L) / (W - L - R)) * (data.length - 1))))); };
  // Se redibuja si cambia el ancho (por ejemplo, al contraer el menú)
  if (!el._ro) { let w = el.clientWidth; el._ro = new ResizeObserver(() => { if (el.isConnected && Math.abs(el.clientWidth - w) > 4) { w = el.clientWidth; drawChart(el, data); } }); el._ro.observe(el); }
  svg.onmouseleave = () => { tipEl.hidden = true; el.querySelector('#cxh').setAttribute('visibility', 'hidden'); el.querySelector('#cpt').setAttribute('visibility', 'hidden'); };
}

  const ki = S.keywords.indexOf(k), a = articleFor(k);
  $('#view').innerHTML = `<div class="wrap">
    <div class="page-h"><button class="btn ghost" id="wBack">${ic('arrowL')}Volver al Blog</button><span class="pill">${ic('target')} ${esc(k.kw)} · ${k.vol.toLocaleString('es-AR')} búsquedas por mes</span></div>
    <div class="writer">
      <div class="card"><div class="sec-h"><b>Artículo</b><span class="st warn" id="wState">Escribiendo…</span></div>
        <div class="cover-gen loading" id="wCover" style="aspect-ratio:auto;max-height:none;height:clamp(160px, 20vw, 280px)">Creando imagen de portada…</div>
        <div class="article" id="wArt" style="margin-top:16px"><h2 id="wT"></h2></div>
      </div>
      <div class="side-sticky">
        <div class="card"><h3>Puntaje SEO</h3><div class="score"><div class="ring" id="wRing" style="--p:0"><b id="wScore">0</b></div><p class="muted" style="font-size:13px;line-height:1.45">Revisa que el artículo esté listo para aparecer en Google y en las respuestas de la IA.</p></div><div id="wChecks" style="margin-top:10px"></div></div>
        <div class="card"><h3>Cómo aparece en Google</h3><div class="form">
          <div class="field"><label for="wSt">Título para Google</label><input class="input" id="wSt" value="${esc(a.seoTitle)}"><div class="count"><span id="wStc"></span> / 60</div></div>
          <div class="field"><label for="wSd">Descripción</label><textarea class="textarea" id="wSd" style="min-height:80px">${esc(a.desc)}</textarea><div class="count"><span id="wSdc"></span> / 160</div></div>
          <div class="serp"><small>grupoeltriunfo.com.ar › recursos</small><b id="wSb"></b><p id="wSp"></p></div></div></div>
        <div class="actions"><button class="btn" id="wDraft" disabled>Guardar borrador</button><button class="btn pri" id="wPub" disabled>${ic('check')}Publicar</button></div>
      </div>
    </div></div>`;
  let ready = false;
  const checks = () => {
    const t = $('#wSt').value, d = $('#wSd').value, kwl = k.kw.toLowerCase().split(' ').slice(0, 2).join(' ');
    return [
      ['La palabra clave está en el título', a.title.toLowerCase().includes(kwl) && ready],
      ['Aparece en el primer párrafo', ready],
      ['Título para Google de hasta 60 caracteres', t.length > 0 && t.length <= 60],
      [d.length > 160 ? 'Descripción de 120 a 160 caracteres: acortala un poco' : 'Descripción de 120 a 160 caracteres', d.length >= 120 && d.length <= 160],
      ['Enlaza a la página del servicio', ready],
      ['Termina con preguntas frecuentes (las usan Google y la IA)', ready],
      ['Imagen de portada con descripción', ready],
    ];
  };
  const paint = () => {
    const c = checks(), sc = Math.round((c.filter((x) => x[1]).length / c.length) * 100);
    $('#wChecks').innerHTML = c.map(([t, ok]) => `<div class="chk ${ok ? 'ok' : ''}"><i>${ok ? '✓' : '·'}</i>${t}</div>`).join('');
    $('#wRing').style.setProperty('--p', sc); $('#wScore').textContent = sc; a.score = sc;
    $('#wStc').textContent = $('#wSt').value.length; $('#wSdc').textContent = $('#wSd').value.length; $('#wSb').textContent = $('#wSt').value; $('#wSp').textContent = $('#wSd').value;
  };
  $('#wSt').oninput = paint; $('#wSd').oninput = paint; paint();
  $('#wBack').onclick = () => go('blog');
  typeInto($('#wT'), a.title, 16, () => {
    let n = 0;
    const next = () => {
      if (n >= a.blocks.length) { ready = true; $('#wCover').classList.remove('loading'); $('#wCover').textContent = ''; $('#wCover').style.backgroundImage = `url(${IMG[(S.services.find((s) => s.name === k.unit) || {}).img || 'grain']})`; $('#wState').textContent = 'Borrador · revisar antes de publicar'; $('#wDraft').disabled = $('#wPub').disabled = false; paint(); return; }
      const [tag, html] = a.blocks[n++], el = document.createElement(tag); $('#wArt').appendChild(el);
      const plain = html.replace(/<[^>]+>/g, '');
      typeInto(el, plain, 5, () => { el.innerHTML = html; paint(); next(); });
    };
    next();
  });
  const save = (status) => {
    const img = (S.services.find((s) => s.name === k.unit) || {}).img || 'grain';
    const ex = S.posts.find((p) => p.kw === k.kw), data = { title: a.title, kw: k.kw, status, date: status === 'Publicado' ? 'Hoy' : 'Recién', img, visits: ex ? ex.visits : 0, leads: ex ? ex.leads : 0, score: a.score };
    if (ex) Object.assign(ex, data); else S.posts.unshift(data);
    S.keywords[ki].status = status; go('blog');
    toast(status === 'Publicado' ? 'Artículo publicado en el blog' : 'Borrador guardado');
  };
  $('#wDraft').onclick = () => save('Borrador');
  $('#wPub').onclick = () => save('Publicado');
}

// ─── Novedades con IA ─────────────────────────────────────────────────────────
function generatePost() {
  const topic = $('#aiTopic').value.trim() || 'Novedades de El Triunfo';
  const title = topic.charAt(0).toUpperCase() + topic.slice(1);
  const paras = [
    `En Grupo El Triunfo acompañamos a los productores de la región en cada etapa de la campaña. Por eso compartimos algunas claves sobre ${topic.toLowerCase()}.`,
    'Planificar con anticipación permite elegir el mejor momento para entregar, acondicionar y comercializar la cosecha, y evita demoras en los momentos de mayor demanda.',
    'Nuestro equipo de Acopio y de Agronomía está a disposición para asesorarlos y coordinar la recepción en planta. Consulten requisitos y condiciones con el equipo comercial.',
  ];
  $('#draftBox').innerHTML = `<div class="card"><div class="sec-h"><b>Borrador</b><span class="st warn">Borrador · revisar antes de publicar</span></div>
    <div class="form"><div class="cover-gen loading" id="cg">Creando imagen de portada…</div><h2 id="dT" style="font-family:var(--title);text-transform:uppercase;color:var(--ink);font-size:28px;line-height:1"></h2><div id="dP" style="display:flex;flex-direction:column;gap:10px;line-height:1.6"></div>
    <div class="field" id="serpWrap" hidden><label>Así se va a ver en Google</label><div class="serp"><small>grupoeltriunfo.com.ar › novedades</small><b>${esc(title)} | El Triunfo</b><p>${esc(paras[0].slice(0, 150))}…</p></div></div>
    <div class="actions"><button class="btn" id="sched">Programar</button><button class="btn pri" id="pub" disabled>${ic('check')}Publicar</button></div></div></div>`;
  $('#gen').disabled = true;
  typeInto($('#dT'), title, 18, () => {
    let k = 0; const next = () => { if (k >= paras.length) { $('#cg').classList.remove('loading'); $('#cg').textContent = ''; $('#cg').style.backgroundImage = `url(${IMG.grain})`; $('#serpWrap').hidden = false; $('#pub').disabled = false; $('#gen').disabled = false; return; }
      const p = document.createElement('p'); $('#dP').appendChild(p); typeInto(p, paras[k++], 6, next); };
    next();
  });
  $('#pub').onclick = () => { S.news.unshift({ title, date: 'Hoy', img: 'grain', status: 'Publicada' }); toast('Novedad publicada en la web'); VIEWS.novedades(); };
  $('#sched').onclick = () => { S.news.unshift({ title, date: 'Programada · lunes 9:00', img: 'grain', status: 'Programada' }); toast('Novedad programada para el lunes 9:00'); VIEWS.novedades(); };
}
function typeInto(el, text, speed, done) { el.classList.add('typing'); let i = 0; const t = setInterval(() => { if (!el.isConnected) return clearInterval(t); i += 2; el.textContent = text.slice(0, i); if (i >= text.length) { clearInterval(t); el.classList.remove('typing'); done && done(); } }, speed); }

// ─── Web + asistente ──────────────────────────────────────────────────────────
function renderSite() {
  $('#sTitle').textContent = S.hero.title; $('#sText').textContent = S.hero.text; $('#shero').style.backgroundImage = `url(${IMG[S.hero.img]})`;
  $('#sCards').innerHTML = S.services.map((s) => `<div class="scard"><div class="ph" style="background-image:url(${IMG[s.img]})"></div><div><b>${esc(s.name)}</b><p>${esc(s.text)}</p></div></div>`).join('');
  // Configuración del asistente
  $('#botName').textContent = S.bot.name; $('#fab').hidden = !S.bot.on;
  $('#invite').textContent = S.bot.inviteText; $('#invite').hidden = !S.bot.on || !S.bot.invite || !$('#chat').hidden;
  if (!S.bot.on) $('#chat').hidden = true;
}
function openSite(withChat, highlight, section) {
  renderSite(); $('#site').hidden = false; $('#site').scrollTop = 0; hideTip(); closeMenu();
  if (section) setTimeout(() => $('#' + section).scrollIntoView({ behavior: 'smooth' }), 150);
  if (highlight) { $('#sTitle').classList.remove('flash'); void $('#sTitle').offsetWidth; $('#sTitle').classList.add('flash'); }
  if (withChat && S.bot.on) setTimeout(openChat, 500);
}
function closeSite() { $('#site').hidden = true; }
$('#openSite').onclick = () => openSite(false);
$('#closeSite').onclick = () => { closeSite(); if (S.tour.chat && !S.tour.lead) go('asistente', { tab: 'conversaciones' }); };

const UNITS = [
  { unit: 'Acopio', re: /acop|soja|ma[ií]z|trigo|giras|grano|cosecha|silo|tonelad/i, a: '¡Sí! <b>El Triunfo Acopio</b> recibe, acondiciona y almacena granos, y te asesora para comercializarlos en el mejor momento.', interest: 'Acopio de granos' },
  { unit: 'Logística', re: /flete|cami[oó]n|transport|log[ií]stic|traslad|llevar/i, a: '<b>El Triunfo Logística</b> traslada semillas, insumos y combustible con flota propia y monitoreo constante.', interest: 'Fletes a campo' },
  { unit: 'Agronomía', re: /agr[oó]nom|ingenier|semilla|fertiliz|pulveriz|rinde|asesor/i, a: 'Nuestro equipo de <b>Ingenieros Agrónomos</b> asesora en semillas, fertilización y pulverización para potenciar tu producción.', interest: 'Asesoramiento agronómico' },
  { unit: 'Bonsmara', re: /bonsmara|toro|vaca|vaquillon|ganad|gen[eé]tic|hacienda/i, a: 'La <b>Cabaña El Triunfo Bonsmara</b> ofrece reproductores de genética certificada, resistentes al calor y de fácil ganancia de peso.', interest: 'Genética Bonsmara' },
  { unit: 'Combustible', re: /combust|gasoil|nafta|shell|estaci[oó]n|cargar/i, a: 'Nuestra estación <b>Shell</b> en Oncativo ofrece combustibles de calidad para vehículos y maquinaria agrícola, con un shop para hacer una pausa.', interest: 'Combustible' },
  { unit: 'Shop', re: /caf[eé]|bar|shop|desayun|comer/i, a: 'El <b>Shop de El Triunfo</b> es un punto de encuentro con buen café y buen ambiente, ideal para una pausa o una reunión.', interest: 'Shop' },
];
// Cada charla en la web queda registrada como conversación en el panel
const now = () => new Date().toTimeString().slice(0, 5);
function liveConvo() {
  if (!S.live) { S.live = { id: 'live' + Date.now(), live: true, first: '', topic: 'Consulta general', out: 'Obtuvo respuesta', mood: 'Neutral', up: 0, down: 0, when: 'Ahora', page: 'Inicio', from: 'Directo', device: isSmall() ? 'Celular' : 'Computadora', msgs: [] }; S.convos.unshift(S.live); }
  return S.live;
}
function botSay(html, cb, rate) {
  const d = document.createElement('div'); d.className = 'm b'; d.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; $('#msgs').appendChild(d); scrollMsgs();
  setTimeout(() => {
    d.innerHTML = html; S.chat.push(['b', d.textContent]);
    const msg = ['b', d.textContent, now()]; if (S.live) S.live.msgs.push(msg);
    if (rate && S.live) {
      const c = S.live, r = document.createElement('div'); r.className = 'rate-btns'; r.innerHTML = `<button data-r="up" title="Me sirvió">${ic('thumbUp')}</button><button data-r="down" title="No me sirvió">${ic('thumbDown')}</button>`;
      r.querySelectorAll('button').forEach((b) => b.onclick = () => { msg[3] = b.dataset.r; c[b.dataset.r]++; if (b.dataset.r === 'up') c.mood = 'Contento'; r.innerHTML = '<small class="muted">¡Gracias por avisar!</small>'; });
      d.appendChild(r);
    }
    scrollMsgs(); cb && cb();
  }, 700 + Math.min(html.length * 6, 900));
}
function userSay(t) { const d = document.createElement('div'); d.className = 'm u'; d.textContent = t; $('#msgs').appendChild(d); S.chat.push(['u', t]); const c = liveConvo(); if (!c.first) c.first = t; c.msgs.push(['u', t, now()]); scrollMsgs(); }
function sysSay(t) { const d = document.createElement('div'); d.className = 'm sys'; d.innerHTML = ic('check') + t; $('#msgs').appendChild(d); scrollMsgs(); }
function scrollMsgs() { $('#msgs').scrollTop = $('#msgs').scrollHeight; }
function setSugg(list) { $('#sugg').innerHTML = list.map((t) => `<button>${esc(t)}</button>`).join(''); $('#sugg').querySelectorAll('button').forEach((b) => b.onclick = () => handle(b.textContent)); }
function openChat() {
  $('#chat').hidden = false; $('#invite').hidden = true;
  if (!$('#msgs').children.length) { botSay(esc(S.bot.greeting)); setSugg(S.bot.sugg); }
  setTimeout(() => $('#chatIn').focus(), 300);
}
$('#fab').onclick = () => $('#chat').hidden ? openChat() : ($('#chat').hidden = true);
$('#closeChat').onclick = () => $('#chat').hidden = true;
$('#chatForm').onsubmit = (e) => { e.preventDefault(); const t = $('#chatIn').value.trim(); if (!t) return; $('#chatIn').value = ''; handle(t); };

function handle(t) {
  userSay(t); setSugg([]); S.tour.chat = true; renderTour();
  const c = S.live, digits = t.replace(/\D/g, '');
  if (S.chatStage === 'askData' || (digits.length >= 7 && S.pendingUnit)) {
    if (digits.length >= 7) return createLead(t);
    if (/^(s[ií]|dale|ok|claro|por favor)/i.test(t)) return botSay('¡Genial! Pasame tu <b>nombre y teléfono</b> y un asesor te contacta a la brevedad.');
    if (/^(no|no gracias|despu[eé]s)/i.test(t)) { S.chatStage = 'idle'; return botSay('¡Perfecto! Si necesitás algo más, acá estoy.'); }
    return botSay('Para que el equipo te contacte necesito tu <b>nombre y un teléfono</b>. Por ejemplo: <i>Martín, 3572 15-123456</i>.');
  }
  // Primero busca en la base de conocimiento (solo lo que está activado)
  const kb = S.knowledge.find((k) => k.on && k.type === 'Pregunta y respuesta' && similar(k.title, t));
  if (kb) return botSay(esc(kb.body) + ' ¿Querés que alguien del equipo te contacte?', () => { S.chatStage = 'askData'; S.pendingUnit = S.pendingUnit || UNITS[0]; setSugg(['Sí, por favor', 'No, gracias']); }, true);
  if (/trigo/i.test(t) && /an[aá]lisis|calidad|laborator/i.test(t)) return unknown(t);
  if (/horario|abren|atienden|hora/i.test(t)) return botSay('Atendemos de <b>lunes a viernes de 8 a 18 h</b> y los <b>sábados de 8 a 12 h</b>. ¿Te ayudo con algo más?', null, true);
  if (/^(hola|buenas|buen d[ií]a|buenas tardes)/i.test(t) && t.length < 25) return botSay('¡Hola! Contame qué necesitás: acopio, fletes, asesoramiento agronómico, toros Bonsmara, combustible o el shop.');
  if (/^s[ií]|dale|ok|por favor/i.test(t) && S.pendingUnit) { S.chatStage = 'askData'; return botSay('¡Genial! Pasame tu <b>nombre y teléfono</b> y un asesor te contacta a la brevedad.'); }
  const u = UNITS.find((x) => x.re.test(t));
  if (u) { S.pendingUnit = u; S.pendingQuestion = t; c.topic = u.unit; c.interest = u.interest; c.page = `Servicios › ${u.unit}`; return botSay(u.a + ' ¿Querés que un asesor te contacte para coordinar?', () => { S.chatStage = 'askData'; setSugg(['Sí, por favor', 'No, gracias']); }, true); }
  return unknown(t);
}
function similar(a, b) { const w = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').match(/[a-z]{4,}/g) || []; const A = w(a), B = w(b); return A.filter((x) => B.includes(x)).length >= 2; }
function unknown(t) {
  const c = S.live, ex = S.unanswered.find((u) => similar(u.q, t));
  if (ex) { ex.n++; ex.last = 'Ahora'; ex.cid = c.id; } else S.unanswered.unshift({ q: t, n: 1, last: 'Ahora', cid: c.id });
  if (c.out !== 'Dejó sus datos') c.out = 'Pregunta sin responder';
  renderSide();
  botSay('Todavía no tengo esa información, pero se la paso al equipo para que te respondan. ¿Querés dejarme tu nombre y teléfono?', () => { S.chatStage = 'askData'; S.pendingUnit = S.pendingUnit || { unit: 'Consulta general', interest: t }; });
}
function createLead(t) {
  const phone = (t.match(/[\d\s-]{7,}/) || [''])[0].trim();
  const name = (t.replace(phone, '').replace(/soy|mi nombre es|me llamo|,|mi (n[uú]mero|tel[eé]fono) es/gi, ' ').trim().split(/\s+/).filter((w) => /^[A-Za-zÁÉÍÓÚáéíóúñÑ]+$/.test(w) && !/^(s[ií]|dale|ok|hola|claro|bueno|buenas|gracias)$/i.test(w)).slice(0, 2).join(' ')) || 'Visitante web';
  const u = S.pendingUnit || { unit: 'Consulta general', interest: 'Consulta general' };
  const q = S.pendingQuestion || u.interest;
  const nice = name.split(' ').map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  const c = S.live; c.out = 'Dejó sus datos'; c.mood = 'Contento'; c.interest = u.interest;
  c.summary = `El visitante consultó por ${u.interest.toLowerCase()} ("${q}"). El asistente le explicó el servicio y ${nice} dejó su nombre y teléfono para que lo contacten.`;
  S.leads.unshift({ name: nice, phone, interest: u.interest, unit: u.unit, status: 'Nuevo', when: 'Ahora', fresh: true, cid: c.id,
    summary: `Consultó por ${u.interest.toLowerCase()} ("${q}"). Dejó sus datos y pidió que lo contacten.` });
  S.chatStage = 'idle'; S.pendingUnit = null; S.pendingQuestion = ''; S.tour.lead = false;
  renderSide();
  botSay(`¡Gracias, ${esc(nice.split(' ')[0])}! Ya le pasé tus datos al equipo. Te van a contactar a la brevedad.`, () => {
    c.msgs.push(['sys', 'Dejó sus datos: se enviaron por mail al equipo']);
    sysSay('Datos enviados al equipo de El Triunfo');
    setTimeout(() => toast('Nuevo contacto · ya está en el panel y llegó por mail'), 400);
    const b = document.createElement('div'); b.className = 'm sys'; b.style.background = 'var(--forest)'; b.style.color = '#fff'; b.style.borderColor = 'var(--forest)';
    b.innerHTML = `${ic('users')}<span style="flex:1">Demo: así le llega al equipo.</span><button class="btn lime" style="padding:5px 10px">Ver en el panel</button>`;
    b.querySelector('button').onclick = () => { closeSite(); go('asistente', { tab: 'contactos' }); S.tour.lead = true; renderTour(); setTimeout(() => openLead(0), 300); };
    $('#msgs').appendChild(b); scrollMsgs();
  });
}

// ─── Inicio ───────────────────────────────────────────────────────────────────
function login() { $('#login').hidden = true; $('#app').hidden = false; go(S.view); }
function logout() { closeDrawer(); closeSite(); $('#app').classList.remove('open'); $('#app').hidden = true; $('#login').hidden = false; }
$('#loginForm').onsubmit = (e) => { e.preventDefault(); login(); };
function resetDemo() { S = fresh(); renderSite(); $('#msgs').innerHTML = ''; $('#chat').hidden = true; $('#invite').hidden = false; closeDrawer(); closeSite(); $('#app').hidden = true; $('#login').hidden = false; renderTour(); }
$('#loginLogo').src = IMG.logo; $('#siteLogo').src = IMG.logo; $('#loginArt').style.backgroundImage = `url(${IMG.cover})`;
document.querySelectorAll('svg[data-i]').forEach((s) => { s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = ICONS[s.dataset.i]; });
renderTour();
</script>
